# Raw output of the DFRobot SEN0244 analog TDS/EC module on GPIO6 (0-2.3 V) [R19].
# The module is powered from Vext, so it only excites the probe during a reading.
# Convert with sen0244_ec25() from shared/esphome/include/water_calc.h.
sensor:
  - platform: adc
    pin: GPIO6
    id: ec_voltage
    attenuation: 12db            # reads up to about 3.1 V on the ESP32-S3 [R17]
    samples: 16
    sampling_mode: avg
    update_interval: never
    internal: true
