<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, Helvetica, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#222">Soldering the AO3401A (SOT-23) on an adapter board</text>
<text x="24" y="56" font-size="13" fill="#555">Same pin order for AO3401A and 2N7002: 1 = Gate, 2 = Source, 3 = Drain. Check the datasheet of the part you bought.</text>

<!-- 1. the chip, seen from above -->
<text x="40" y="96" font-size="15" font-weight="bold" fill="#222">1. The chip, seen from above</text>
<text x="40" y="114" font-size="12" fill="#555">(marking readable, actual size about 3 x 1.5 mm)</text>
<rect x="125" y="140" width="22" height="34" fill="#9e9e9e"/>
<rect x="95" y="174" width="150" height="80" rx="4" fill="#333"/>
<text x="170" y="220" font-size="16" fill="#fff" text-anchor="middle">marking</text>
<rect x="105" y="254" width="22" height="34" fill="#9e9e9e"/>
<rect x="213" y="254" width="22" height="34" fill="#9e9e9e"/>
<text x="136" y="134" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">3 = D</text>
<text x="116" y="308" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">1 = G</text>
<text x="224" y="308" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">2 = S</text>
<text x="40" y="340" font-size="12" fill="#555">Two legs on one side (1 and 2),</text>
<text x="40" y="356" font-size="12" fill="#555">one leg alone on the other side (3).</text>

<!-- 2. adapter back side -->
<text x="370" y="96" font-size="15" font-weight="bold" fill="#222">2. The BACK of your adapter (SOT23-6 side)</text>
<text x="370" y="114" font-size="12" fill="#555">The SOP10 / 0.5MM side in your photo is for 10-pin chips: turn the board over.</text>
<rect x="420" y="130" width="300" height="380" rx="6" fill="#2e7d32"/>
<g fill="#fff" stroke="#bdbdbd" stroke-width="2">
<circle cx="455" cy="170" r="13"/><circle cx="455" cy="240" r="13"/><circle cx="455" cy="310" r="13"/><circle cx="455" cy="380" r="13"/><circle cx="455" cy="450" r="13"/>
<circle cx="685" cy="170" r="13"/><circle cx="685" cy="240" r="13"/><circle cx="685" cy="310" r="13"/><circle cx="685" cy="380" r="13"/><circle cx="685" cy="450" r="13"/>
</g>
<text x="570" y="160" font-size="13" fill="#fff" text-anchor="middle">SOT23-6</text>
<!-- top row pads 6 5 4 -->
<rect x="526" y="250" width="16" height="30" fill="#e0e0e0"/><rect x="562" y="250" width="16" height="30" fill="#ffca28" stroke="#222"/><rect x="598" y="250" width="16" height="30" fill="#e0e0e0"/>
<!-- bottom row pads 1 2 3 -->
<rect x="526" y="330" width="16" height="30" fill="#ffca28" stroke="#222"/><rect x="562" y="330" width="16" height="30" fill="#e0e0e0"/><rect x="598" y="330" width="16" height="30" fill="#ffca28" stroke="#222"/>
<g font-size="12" fill="#fff" text-anchor="middle"><text x="534" y="244">6</text><text x="570" y="244">5</text><text x="606" y="244">4</text><text x="534" y="378">1</text><text x="570" y="378">2</text><text x="606" y="378">3</text></g>
<text x="570" y="410" font-size="12" fill="#fff" text-anchor="middle">yellow = pads you use</text>
<text x="570" y="428" font-size="12" fill="#fff" text-anchor="middle">grey = leave empty</text>
<g font-size="13" fill="#222">
<text x="740" y="270">pad 5 &lt;- chip leg 3 (D)</text>
<text x="740" y="345">pad 1 &lt;- chip leg 1 (G)</text>
<text x="740" y="365">pad 3 &lt;- chip leg 2 (S)</text>
</g>
<text x="370" y="536" font-size="12" fill="#555">Pad numbers are printed next to the pads on most boards. Which pin hole each pad goes to differs per board:</text>
<text x="370" y="552" font-size="12" font-weight="bold" fill="#d32f2f">follow the copper track, or check with a multimeter (continuity beep), and write G / S / D next to the holes.</text>

<!-- 3. steps -->
<text x="40" y="400" font-size="15" font-weight="bold" fill="#222">3. Soldering</text>
<g font-size="12" fill="#222">
<text x="40" y="422">a. Tin ONE pad (pad 1) with a little solder.</text>
<text x="40" y="440">b. Hold the chip with tweezers, legs on</text>
<text x="56" y="456">pads 1, 3 and 5; reheat pad 1.</text>
<text x="40" y="474">c. Check it sits straight, then solder</text>
<text x="56" y="490">legs on pads 3 and 5.</text>
<text x="40" y="508">d. Solder the pin header into the holes</text>
<text x="56" y="524">(only the 3 you need, or all).</text>
<text x="40" y="542">e. Multimeter: no beep between G-S,</text>
<text x="56" y="558">G-D or S-D (no solder bridge).</text>
</g>
<text x="24" y="610" font-size="12" fill="#555">A board with a plain 3-pad "SOT-23" footprint works the same way: leg 1 on pad 1, leg 2 on pad 2, leg 3 on pad 3.</text>
</svg>
