<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#222">Boost converter power switch (BC327 PNP + BC337 NPN)</text>
<text x="24" y="56" font-size="13" fill="#555">GPIO7 HIGH = boost ON. The 100 kohm pull-down keeps it OFF during deep sleep. All parts through-hole.</text>
<!-- battery -->
<rect x="40" y="90" width="130" height="60" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="105" y="116" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">BAT+</text>
<text x="105" y="136" font-size="12" fill="#222" text-anchor="middle">(18650 cell)</text>
<line x1="170" y1="120" x2="330" y2="120" stroke="#ef6c00" stroke-width="2.5"/>
<circle cx="230" cy="120" r="4.5" fill="#ef6c00"/>
<!-- 10k B-E -->
<line x1="230" y1="120" x2="230" y2="140" stroke="#222" stroke-width="2.5"/>
<rect x="220" y="140" width="20" height="55" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="212" y="172" font-size="13" fill="#222" text-anchor="end">10 k</text>
<line x1="230" y1="195" x2="230" y2="215" stroke="#222" stroke-width="2.5"/>
<circle cx="230" cy="215" r="4.5" fill="#222"/>
<!-- PNP box -->
<rect x="330" y="85" width="170" height="150" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="415" y="112" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">BC327-25</text>
<text x="415" y="130" font-size="12" fill="#222" text-anchor="middle">PNP</text>
<text x="340" y="124" font-size="13" font-weight="bold" fill="#222">E</text>
<text x="340" y="219" font-size="13" font-weight="bold" fill="#222">B</text>
<text x="482" y="124" font-size="13" font-weight="bold" fill="#222">C</text>
<line x1="230" y1="215" x2="330" y2="215" stroke="#222" stroke-width="2.5"/>
<!-- collector to MT3608 -->
<line x1="500" y1="120" x2="680" y2="120" stroke="#ef6c00" stroke-width="2.5"/>
<text x="560" y="110" font-size="11" fill="#777">collector</text>
<circle cx="620" cy="120" r="4.5" fill="#ef6c00"/>
<line x1="620" y1="120" x2="620" y2="150" stroke="#222" stroke-width="2.5"/>
<line x1="604" y1="150" x2="636" y2="150" stroke="#222" stroke-width="3"/>
<line x1="604" y1="160" x2="636" y2="160" stroke="#222" stroke-width="3"/>
<line x1="620" y1="160" x2="620" y2="195" stroke="#222" stroke-width="2.5"/>
<line x1="605" y1="195" x2="635" y2="195" stroke="#222" stroke-width="2.5"/><line x1="611" y1="202" x2="629" y2="202" stroke="#222" stroke-width="2"/><line x1="616" y1="209" x2="624" y2="209" stroke="#222" stroke-width="2"/>
<text x="596" y="160" font-size="12" fill="#222" text-anchor="end">220-470 uF</text>
<rect x="680" y="85" width="180" height="90" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
<text x="770" y="112" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">MT3608 boost</text>
<text x="770" y="134" font-size="12" fill="#222" text-anchor="middle">IN+ = switched BAT+</text>
<text x="770" y="152" font-size="12" fill="#222" text-anchor="middle">OUT+ = 18.0 V</text>
<!-- 470R base resistor down to NPN collector -->
<line x1="230" y1="215" x2="230" y2="250" stroke="#222" stroke-width="2.5"/>
<rect x="220" y="250" width="20" height="55" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="212" y="282" font-size="13" fill="#222" text-anchor="end">470 ohm</text>
<line x1="230" y1="305" x2="230" y2="330" stroke="#222" stroke-width="2.5"/>
<line x1="230" y1="330" x2="330" y2="330" stroke="#222" stroke-width="2.5"/>
<!-- NPN box -->
<rect x="330" y="300" width="170" height="120" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="415" y="350" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">BC337-25</text>
<text x="415" y="368" font-size="12" fill="#222" text-anchor="middle">NPN</text>
<text x="340" y="334" font-size="13" font-weight="bold" fill="#222">C</text>
<text x="340" y="404" font-size="13" font-weight="bold" fill="#222">B</text>
<text x="482" y="404" font-size="13" font-weight="bold" fill="#222">E</text>
<line x1="500" y1="400" x2="560" y2="400" stroke="#222" stroke-width="2.5"/>
<line x1="545" y1="400" x2="575" y2="400" stroke="#222" stroke-width="2.5"/><line x1="560" y1="400" x2="560" y2="420" stroke="#222" stroke-width="2.5"/>
<line x1="545" y1="420" x2="575" y2="420" stroke="#222" stroke-width="2.5"/><line x1="551" y1="427" x2="569" y2="427" stroke="#222" stroke-width="2"/><line x1="556" y1="434" x2="564" y2="434" stroke="#222" stroke-width="2"/>
<!-- base network -->
<text x="40" y="404" font-size="14" font-weight="bold" fill="#2e7d32">GPIO7</text>
<line x1="92" y1="400" x2="110" y2="400" stroke="#2e7d32" stroke-width="2.5"/>
<rect x="110" y="390" width="60" height="20" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
<text x="140" y="382" font-size="13" fill="#222" text-anchor="middle">4.7 k</text>
<line x1="170" y1="400" x2="330" y2="400" stroke="#2e7d32" stroke-width="2.5"/>
<circle cx="270" cy="400" r="4.5" fill="#222"/>
<line x1="270" y1="400" x2="270" y2="420" stroke="#222" stroke-width="2.5"/>
<rect x="260" y="420" width="20" height="40" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="252" y="445" font-size="13" fill="#222" text-anchor="end">100 k</text>
<line x1="270" y1="460" x2="270" y2="470" stroke="#222" stroke-width="2.5"/>
<line x1="255" y1="470" x2="285" y2="470" stroke="#222" stroke-width="2.5"/><line x1="261" y1="477" x2="279" y2="477" stroke="#222" stroke-width="2"/>
<text x="600" y="300" font-size="12" fill="#555">Legs (TO-92, flat side facing you, legs down):</text>
<text x="600" y="318" font-size="12" font-weight="bold" fill="#222">BC327 and BC337: C - B - E</text>
<text x="600" y="336" font-size="12" fill="#555">check the datasheet of your part.</text>
<text x="600" y="366" font-size="12" fill="#555">Alternative NPN: 2N7000 MOSFET with</text>
<text x="600" y="382" font-size="12" fill="#555">100 ohm instead of 4.7 k (legs S - G - D).</text>
</svg>
