# BROOK LITE indoor LoRa gateway: receives the node packets (water level, water temperature, EC,
# air temperature, humidity and pressure), exposes them to Home Assistant and uploads to openSenseMap.
#
# Sources: ESPHome packet_transport [R2], sx126x [R1], http_request [R6]; openSenseMap upload [R26][R27][R28]
# (see shared/docs/REFERENCES.md).
#
# To add a station:
#   1. add its secrets to secrets.yaml and an `sN_*` block under `substitutions:`
#   2. add a provider entry under `packet_transport:`
#   3. add a package entry under `packages:`

#
# Wi-Fi, API, OTA, the LoRa radio and the openSenseMap upload are shared with groundwater/:
# see shared/esphome/gateway/.

substitutions:
  gateway_ap_ssid: "Brook Lite Gateway"
  gateway_useragent: esphome/brook-lite-gateway
  lora_frequency: "869525000"      # same as the node
  # Node counted offline after 35 min without a packet (3 missed 10-minute cycles).
  # If you change sleep_minutes on the node, set this to about 3.5 x the cycle.
  offline_after_ms: "2100000"

  # Station 1
  s1_sensor_height: !secret station_1_sensor_height_m
  s1_box_id: !secret station_1_osem_box_id
  s1_token: !secret station_1_osem_token
  s1_level_id: !secret station_1_osem_level_id
  s1_temp_id: !secret station_1_osem_water_temp_id
  s1_ec_id: !secret station_1_osem_ec_id
  s1_air_temp_id: !secret station_1_osem_air_temp_id
  s1_air_hum_id: !secret station_1_osem_air_hum_id
  s1_pressure_id: !secret station_1_osem_pressure_id

packages:
  gateway_base: !include ../../../../shared/esphome/gateway/gateway-base.yaml
  opensensemap: !include ../../../../shared/esphome/gateway/opensensemap.yaml
  station1: !include
    file: station-package.yaml
    vars:
      st: s1
      st_label: "Brook"
      node_name: brook-lite-node-1
      range_m: "2.0"               # must match range_m of the node
      sensor_height: ${s1_sensor_height}
      box_id: ${s1_box_id}
      token: ${s1_token}
      level_id: ${s1_level_id}
      temp_id: ${s1_temp_id}
      ec_id: ${s1_ec_id}
      air_temp_id: ${s1_air_temp_id}
      air_hum_id: ${s1_air_hum_id}
      pressure_id: ${s1_pressure_id}

esphome:
  name: brook-lite-gateway
  friendly_name: "Brook Lite Gateway"

# A receiver needs the key of each provider (node) it listens to [R2].
packet_transport:
  - platform: sx126x
    id: lora_transport
    providers:
      - name: brook-lite-node-1
        encryption: !secret lora_encryption_key
