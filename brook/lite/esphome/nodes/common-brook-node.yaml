# BROOK LITE field node (Heltec WiFi LoRa 32 V3), battery powered.
# Measures:
#   * water above the TL-136 (0-2 m, 4-20 mA across a shunt, ESP32 ADC)
#   * water temperature (DS18B20)
#   * electrical conductivity, temperature-compensated to 25 °C (DFRobot SEN0244 analog TDS/EC sensor)
#   * air temperature, relative humidity and pressure (BME280, in a radiation shield on the bank)
#   * battery voltage (diagnostic)
# The gateway turns "water above the sensor" into the water level on the staff gauge.
# Deep sleep: no network or OTA while asleep [R7]; DS18B20 conversion time [R8][R23].
# Per-node values are overridden in brook-lite-node-N.yaml via `substitutions:`.
#
# Sources for the settings below are listed in shared/docs/REFERENCES.md ([R#] tags in comments):
#   sx126x / packet_transport / adc / deep_sleep / bme280 ...  -> ESPHome component docs [R1]-[R9]
#   Heltec V3 pins, battery divider, Vext, TCXO               -> [R10]-[R14]
#
# The board, LoRa radio, Vext/battery/LED outputs, I2C and 1-Wire buses, battery sensor,
# deep sleep, the level and EC inputs and the formulas are shared with groundwater/:
# see shared/esphome/.

packages:
  node_base: !include ../../../../shared/esphome/heltec-v3/node-base.yaml
  level_adc: !include ../../../../shared/esphome/sensors/tl136-adc-esp.yaml
  ec_adc: !include ../../../../shared/esphome/sensors/ec-sen0244-adc.yaml

substitutions:
  # --- timing ---
  sleep_minutes: "10"            # time between readings (a 0-30 s random jitter is added)
                                 # brooks react fast; 10 min is a good balance with battery life (docs/field-guide.md section 6)
  low_battery_v: "3.4"           # below this, skip measuring and sleep longer (ignored if the reading is < 2 V)
  low_battery_sleep_minutes: "120"
  warmup: 700ms                  # extra settling time after boot (Vext is already on since early boot)
  ds18b20_wait: 900ms            # DS18B20 12-bit conversion takes up to 750 ms [R23]
  tx_wait: 1500ms                # airtime + margin before the radio sleeps [R22]
  # --- level channel (TL-136, 4-20 mA across a shunt resistor) ---
  range_m: "2.0"                 # full-scale range of the TL-136 (0-2 m: a brook changes at most ~2 m)
  shunt_ohm: "100.0"             # 100 ohm keeps 20 mA (2.0 V) inside the ESP32-S3 ADC range
  zero_offset_m: "0.0"           # add after comparing with the staff gauge
  span_scale: "1.0"              # multiplies the span (1.0 = nominal)
  # --- EC channel (two-point calibration, docs/field-guide.md section 3.2) ---
  ec_gain: "1.0"
  ec_offset: "0.0"
  # Battery divider and board revision (vbat_scale, vbat_ctrl_active_low, vext_active_low):
  # defaults in shared/esphome/heltec-v3/node-base.yaml, override them in the node file.
  # --- LoRa: 869.525 MHz (869.4-869.65 MHz sub-band, 10 % duty cycle) [R25] ---
  lora_frequency: "869525000"
  # --- BME280 (air temperature + humidity) ---
  bme280_address: "0x76"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    # BME280 and DS18B20 are powered from Vext and are probed once during setup,
    # so the rail must be ON before they are set up.
    # Priority 750 = after the GPIO output exists (800) and before sensors (600).
    - priority: 750
      then:
        - output.turn_on: vext_power
        - lambda: 'delay(30);'
    - priority: -100
      then:
        - script.execute: measure_and_sleep

# The node only transmits, once per cycle, when the script calls component.update.
packet_transport:
  - platform: sx126x
    id: lora_transport
    update_interval: never
    encryption: !secret lora_encryption_key
    sensors:
      # Short broadcast IDs keep the frame small. The gateway maps them with `remote_id:`.
      - id: water_column_m
        broadcast_id: d
      - id: water_temp_c
        broadcast_id: t
      - id: ec_compensated_us
        broadcast_id: ec
      - id: air_temp_c
        broadcast_id: at
      - id: air_humidity
        broadcast_id: ah
      - id: air_pressure
        broadcast_id: ap
      - id: battery_voltage_v
        broadcast_id: v

sensor:
  # 1. Air temperature, relative humidity and pressure (BME280 in a radiation shield, outside the box).
  #    Address 0x76 (SDO to GND) or 0x77 (SDO to VCC) [R5][R24].
  - platform: bme280_i2c
    id: bme280_hub
    address: ${bme280_address}
    update_interval: never
    temperature:
      id: air_temp_c
      name: "Air Temperature"
      oversampling: 1x
    humidity:
      id: air_humidity
      name: "Air Humidity"
      oversampling: 1x
    pressure:
      id: air_pressure
      name: "Air Pressure"
      oversampling: 1x

  # 2. Water temperature (DS18B20). Result arrives ~750 ms after update.
  - platform: dallas_temp
    id: water_temp_c
    name: "Water Temperature"
    accuracy_decimals: 2
    update_interval: never

  # 3. Shunt voltage `depth_voltage` of the level channel on GPIO5 (through 1 kohm + clamp, docs/wiring.md):
  #    shared/esphome/sensors/tl136-adc-esp.yaml.

  # 4. Water above the sensor (TL-136 0-${range_m} m, 4-20 mA across ${shunt_ohm} ohm).
  - platform: template
    id: water_column_m
    name: "Water Above Sensor"
    unit_of_measurement: "m"
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      // NAN outside 3.5-22 mA (broken wire, short, boost fault). Between 20 and 22 mA (a flood beyond
      // the range) the value is kept: it shows 'at least range_m'. See shared/esphome/include/water_calc.h
      return tl136_column_m(tl136_loop_ma(id(depth_voltage).state, ${shunt_ohm}), ${range_m}, ${span_scale}, ${zero_offset_m});

  # 5. EC module output `ec_voltage` on GPIO6: shared/esphome/sensors/ec-sen0244-adc.yaml.
  #    The probe sits in the brook, the module in the dry box.

  # 6. EC at 25 °C, compensated with the DS18B20 temperature (2 %/°C).
  - platform: template
    id: ec_compensated_us
    name: "Electrical Conductivity (EC25)"
    unit_of_measurement: "µS/cm"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      // Temperature compensation, DFRobot curve [R19] and calibration: shared/esphome/include/water_calc.h
      float ec = sen0244_ec25(id(ec_voltage).state, id(water_temp_c).state, ${ec_gain}, ${ec_offset});
      return ec < 0.0f ? 0.0f : ec;

  # 7. Node battery voltage `battery_voltage_v`: shared/esphome/heltec-v3/node-base.yaml.

script:
  - id: measure_and_sleep
    mode: single
    then:
      # Wake-up flash + battery reading with the divider enabled
      - output.turn_on: status_led
      - output.turn_on: vbat_adc_enable
      - delay: 50ms
      - component.update: battery_voltage_v
      - output.turn_off: vbat_adc_enable
      - output.turn_off: status_led

      # Low battery: report the voltage only, then sleep much longer
      - if:
          condition:
            # Below 2 V (or NaN) the divider is not connected (wrong vbat_ctrl_active_low?),
            # not an empty cell: do not lock the node into low-battery mode.
            lambda: |-
              float v = id(battery_voltage_v).state;
              return !isnan(v) && v > 2.0f && v < ${low_battery_v};
          then:
            - output.turn_off: vext_power
            - component.update: lora_transport
            - delay: ${tx_wait}
            - sx126x.set_mode_sleep:
            - deep_sleep.enter:
                id: deep_sleep_control
                sleep_duration: !lambda 'return (uint32_t) ${low_battery_sleep_minutes} * 60000UL;'

      # Normal cycle
      - output.turn_on: vext_power         # already on; harmless
      - delay: ${warmup}
      - component.update: bme280_hub
      - component.update: water_temp_c
      - component.update: depth_voltage
      - component.update: ec_voltage
      - delay: ${ds18b20_wait}             # DS18B20 / BME280 results arrive meanwhile
      - component.update: water_column_m   # needs depth_voltage
      - component.update: ec_compensated_us # needs the water temperature
      - output.turn_off: vext_power
      - component.update: lora_transport   # broadcast all values
      - delay: ${tx_wait}
      - sx126x.set_mode_sleep:
      - deep_sleep.enter:
          id: deep_sleep_control
          # random 0-30 s jitter keeps several nodes from colliding over time
          sleep_duration: !lambda 'return (uint32_t) ${sleep_minutes} * 60000UL + (random_uint32() % 30000UL);'
