# =============================================================================
# De Meetbeek - WATER SENSOR NODE
# Board  : Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
# Sensors: TL-136 level (4-20 mA), DS18B20 water temperature,
#          DFRobot SEN0244 analog TDS/EC sensor, DFRobot SEN0189 turbidity,
#          JSN-SR04T ultrasonic  (+ ADS1115 16-bit ADC)
# Radio  : raw LoRa (EU 868 MHz band) -> gateway. No Wi-Fi, no API (battery node).
# Power  : 2x18650 (parallel) + CN3791 + 12 V solar panel
#
# HOW IT WORKS
#   1. Node wakes from deep sleep and reads the battery at rest (boosters still off).
#   2. Battery low? It sends only the battery voltage and sleeps ${low_battery_sleep}
#      without powering the sensors, so a dark week cannot drain the cells.
#   3. Otherwise it powers the sensors, takes ${samples} readings and sends the RAW
#      values (volts, deg C, metres) in one small encrypted packet_transport frame.
#   4. It goes back to sleep. All calibration happens in the GATEWAY, so you
#      can re-calibrate without climbing down to the stream.
#
# Payload: ESPHome packet_transport, encrypted with lora_encryption_key (secrets.yaml).
#   broadcast IDs: v (battery V), t (water deg C), vl (loop V), ve (EC V),
#   vt (turbidity V, after the divider), d (distance m), n (sequence number, last)
#   A sensor that was not read (low-battery mode, fault) is sent as NaN ("unknown").
#   Gateway and node must use the same lora_encryption_key.
#
# FLASHING: by USB cable (this node is asleep, so no OTA).
# Requires ESPHome >= 2025.7 (sx126x component). Pins: see docs/wiring.md
# =============================================================================

substitutions:
  node_name: brook-water-node
  friendly: "De Meetbeek Water Node"

  # --- Radio: MUST be identical in the gateway file ---------------------------
  # 869.525 MHz lies in the 869.4-869.65 MHz sub-band (10 % duty cycle).
  # Use 868100000 for the 1 % sub-band if you prefer (then keep SF <= 9).
  lora_frequency_hz: "869525000"
  lora_spreading_factor: "9"     # 7 = short range/fast ... 12 = long range/slow
  lora_tx_power_dbm: "14"        # keep power + antenna gain within local EIRP limits

  # --- Timing ------------------------------------------------------------------
  sleep_time: 5min               # time between measurements
  samples: "5"                   # readings per wake-up (the median is sent)

  # --- Low battery ----------------------------------------------------------------
  # Below this voltage (read at rest, before the boosters start) the node skips the
  # sensors and only reports its battery voltage. Readings under 2 V are treated as a
  # wrong vbat_ctrl_inverted setting, not as an empty battery, and are ignored.
  low_battery_v: "3.4"
  low_battery_sleep: 15min       # < offline_after_ms in the gateway, so Node Online stays on

  # --- Heltec V3 battery sense (on-board divider) ------------------------------
  vbat_divider: "4.9"            # (390k + 100k) / 100k. Tune with a multimeter.
  vbat_ctrl_inverted: "true"     # true = GPIO37 LOW enables the divider (V3/V3.1).
                                 # If battery reads ~0 V, try "false" (some V3.2).

esphome:
  name: ${node_name}
  friendly_name: ${friendly}
  on_boot:
    priority: -100
    then:
      - script.execute: measure_and_send

esp32:
  board: heltec_wifi_lora_32_V3
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: INFO

# Failsafe: whatever happens, never stay awake longer than 40 s.
deep_sleep:
  id: deep_sleep_1
  run_duration: 40s
  sleep_duration: ${sleep_time}

# --- LoRa radio (SX1262 on the Heltec V3: these pins are fixed on the board) --
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

sx126x:
  id: radio
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  hw_version: sx1262
  frequency: ${lora_frequency_hz}
  modulation: LORA
  bandwidth: 125_0kHz
  spreading_factor: ${lora_spreading_factor}
  coding_rate: CR_4_6
  preamble_size: 8
  sync_value: [0x14, 0x24]       # private network sync word
  crc_enable: true
  pa_power: ${lora_tx_power_dbm}
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms

# Encrypted frame with the raw values. The node only transmits when the send_payload
# script calls component.update. Short broadcast IDs keep the frame (and airtime) small;
# the gateway maps them with `remote_id:` (brook_gateway.yaml).
packet_transport:
  - platform: sx126x
    id: lora_transport
    update_interval: never
    encryption: !secret lora_encryption_key
    sensors:
      - id: vbat_adc
        broadcast_id: v
      - id: ds_water_temp
        broadcast_id: t
      - id: ads_loop
        broadcast_id: vl
      - id: ads_ec
        broadcast_id: ve
      - id: ads_turb
        broadcast_id: vt
      - id: us_dist
        broadcast_id: d
      # Sequence number LAST: the gateway starts its calculation when it arrives.
      - id: tx_seq
        broadcast_id: "n"

# --- External buses ---------------------------------------------------------
i2c:
  sda: GPIO41
  scl: GPIO42
  frequency: 100kHz

one_wire:
  - platform: gpio
    pin: GPIO5

ads1115:
  - address: 0x48
    id: ads

# --- Power switches ---------------------------------------------------------
switch:
  # Heltec "Vext": the board's OWN switched 3.3 V output (LOW = on, about 350 mA max).
  # It powers the two MT3608 boosters: ~15 V (TL-136 loop) and 5 V (SEN0189
  # turbidity, SEN0244 TDS/EC, JSN-SR04T). No external MOSFET needed. See docs/wiring.md
  - platform: gpio
    id: boost_enable
    pin:
      number: GPIO36
      inverted: true
    restore_mode: ALWAYS_OFF
    internal: true
  # Enables the on-board battery voltage divider
  - platform: gpio
    id: vbat_divider_enable
    pin:
      number: GPIO37
      inverted: ${vbat_ctrl_inverted}
    restore_mode: ALWAYS_OFF
    internal: true

# --- Sensors (all polled manually by the script below) -----------------------
sensor:
  - platform: dallas_temp
    id: ds_water_temp
    update_interval: never
    resolution: 12
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # TL-136 4-20 mA loop: voltage across the shunt resistor (A0)
  - platform: ads1115
    ads1115_id: ads
    id: ads_loop
    multiplexer: A0_GND
    gain: 4.096
    sample_rate: 128
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # SEN0244 TDS/EC sensor analog output, 0-2.3 V (A1)
  - platform: ads1115
    ads1115_id: ads
    id: ads_ec
    multiplexer: A1_GND
    gain: 4.096
    sample_rate: 128
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # SEN0189 turbidity analog output (up to 4.5 V) AFTER the 2:1 divider (A2)
  - platform: ads1115
    ads1115_id: ads
    id: ads_turb
    multiplexer: A2_GND
    gain: 4.096
    sample_rate: 128
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # JSN-SR04T ultrasonic. ESPHome reports METRES (assuming a fixed speed of sound).
  - platform: ultrasonic
    trigger_pin: GPIO6
    echo_pin: GPIO7
    id: us_dist
    pulse_time: 20us
    timeout: 3m
    update_interval: never
    filters:
      - median:
          window_size: ${samples}
          send_every: ${samples}
          send_first_at: ${samples}

  # Battery voltage through the Heltec on-board divider (GPIO1).
  # Read ONCE per wake-up, at rest (boosters off), averaging 16 ADC samples.
  - platform: adc
    pin: GPIO1
    id: vbat_adc
    attenuation: 6db
    samples: 16
    sampling_mode: avg
    update_interval: never
    filters:
      - multiply: ${vbat_divider}

  # Sequence number. RTC memory survives deep sleep but not a power loss, so a counter
  # that starts again at 1 tells the gateway the node lost power ("node reset").
  - platform: template
    id: tx_seq
    update_interval: never
    internal: true
    lambda: |-
      static RTC_DATA_ATTR uint32_t seq = 0;
      seq++;
      return (float) seq;

# --- Measurement + transmit sequence ----------------------------------------
script:
  - id: measure_and_send
    mode: single
    then:
      # 1. Battery at rest: divider on, boosters still OFF (their ~200 mA would make it sag)
      - switch.turn_on: vbat_divider_enable
      - delay: 50ms
      - component.update: vbat_adc
      - switch.turn_off: vbat_divider_enable

      # 2. Low battery: report the voltage only (other sensors NaN), then sleep longer.
      #    Otherwise: the normal cycle.
      - if:
          condition:
            lambda: |-
              float v = id(vbat_adc).state;
              return !std::isnan(v) && v > 2.0f && v < ${low_battery_v};
          then:
            - logger.log:
                level: WARN
                format: "Battery low (%.2f V): sensors skipped, sleeping ${low_battery_sleep}"
                args: ['id(vbat_adc).state']
            - script.execute: send_payload
            - script.wait: send_payload
            - sx126x.set_mode_sleep:
                cold: true
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: ${low_battery_sleep}
          else:
            # 3. Normal cycle: power the sensors and let probes and boosters settle
            - switch.turn_on: boost_enable
            - delay: 3s
            - repeat:
                count: ${samples}
                then:
                  - component.update: ds_water_temp
                  - component.update: ads_loop
                  - delay: 150ms
                  - component.update: ads_ec
                  - delay: 150ms
                  - component.update: ads_turb
                  - delay: 150ms
                  - component.update: us_dist
                  - delay: 700ms
            - delay: 500ms
            - switch.turn_off: boost_enable
            - script.execute: send_payload
            - script.wait: send_payload
            - sx126x.set_mode_sleep:
                cold: true
            - deep_sleep.enter:
                id: deep_sleep_1

  # Sends the current states in one encrypted frame, twice.
  # In low-battery mode the sensors were never read, so they go out as NaN.
  - id: send_payload
    mode: single
    then:
      - component.update: tx_seq
      - lambda: |-
          ESP_LOGI("brook", "TX seq %.0f: vbat %.3f V, water %.2f C, loop %.4f V, EC %.4f V, turb %.4f V, dist %.3f m",
                   id(tx_seq).state, id(vbat_adc).state, id(ds_water_temp).state, id(ads_loop).state,
                   id(ads_ec).state, id(ads_turb).state, id(us_dist).state);
      # Raw LoRa has no ACK, so every reading is sent twice; the gateway ignores the
      # second copy (same sequence number).
      - component.update: lora_transport
      - delay: 1500ms
      - component.update: lora_transport
      - delay: 1500ms
