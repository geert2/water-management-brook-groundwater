<text x="24" y="34" font-size="20" text-anchor="start" font-weight="bold" fill="#222">Well installation - cross section (not to scale)</text>
<text x="24" y="56" font-size="13" text-anchor="start" font-weight="normal" fill="#555">Where to measure A and B, and how the depth values relate.</text>
