<text x="832" y="372" font-size="12" text-anchor="end" font-weight="bold" fill="#01579b">Water table depth</text>
<text x="832" y="388" font-size="12" text-anchor="end" font-weight="normal" fill="#01579b">below ground</text>
<text x="832" y="404" font-size="12" text-anchor="end" font-weight="normal" fill="#01579b">= sensor depth - column</text>
