<text x="675" y="171" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">membrane vent + desiccant</text>
<text x="675" y="189" font-size="11" text-anchor="middle" font-weight="normal" fill="#777">>= 0.5 m above ground</text>
