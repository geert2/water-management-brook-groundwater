<polyline points="883.5047650807778,508.28954894602595 880,500 876.4952349192222,508.28954894602595" fill="none" stroke="#0288d1" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="872" y="560" font-size="12" text-anchor="end" font-weight="bold" fill="#0288d1">Water column</text>
