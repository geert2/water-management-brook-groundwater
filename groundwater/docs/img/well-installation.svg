<text x="872" y="592" font-size="12" text-anchor="end" font-weight="normal" fill="#0288d1">(measured)</text>
<text x="24" y="736" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Mark the cables at the rim, then measure A (mark to sensing tip) and B (rim above soil).</text>
<text x="24" y="754" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Enter A - B as "Sensor Depth Below Ground" in Home Assistant and check it against a manual dip-meter reading.</text>
