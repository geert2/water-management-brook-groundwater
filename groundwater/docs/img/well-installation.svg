<text x="192" y="392" font-size="13" text-anchor="end" font-weight="bold" fill="#b71c1c">= A - B</text>
<line x1="840" y1="260" x2="840" y2="500" stroke="#01579b" stroke-width="1.8" stroke-linecap="round"/>
