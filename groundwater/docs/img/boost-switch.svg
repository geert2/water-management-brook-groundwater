<rect x="580" y="90" width="170" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
<text x="665" y="116" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">MT3608 boost</text>
<text x="665" y="136" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">IN+ = switched BAT+</text>
<text x="665" y="154" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">OUT+ = 18.0 V</text>
