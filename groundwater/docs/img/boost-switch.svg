<line x1="545" y1="185.0" x2="545" y2="200" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="531" y1="175.0" x2="559" y2="175.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
