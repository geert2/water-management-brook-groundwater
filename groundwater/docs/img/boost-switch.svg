<line x1="260" y1="145" x2="300" y2="145" stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round"/>
<line x1="450" y1="145" x2="580" y2="145" stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round"/>
<text x="515" y="137" font-size="11" text-anchor="middle" font-weight="normal" fill="#777">drain</text>
<line x1="230" y1="120" x2="230" y2="127.5" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="230" y1="187.5" x2="230" y2="195" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
