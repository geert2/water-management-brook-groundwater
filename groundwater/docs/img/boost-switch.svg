<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Arial, Helvetica, sans-serif">
<rect width="900" height="480" fill="#ffffff"/>
<text x="24" y="34" font-size="20" text-anchor="start" font-weight="bold" fill="#222">Boost converter power switch (AO3401 + 2N7002)</text>
<text x="24" y="56" font-size="13" text-anchor="start" font-weight="normal" fill="#555">GPIO7 HIGH = boost ON. The 100 kohm pull-down keeps it OFF during deep sleep.</text>
<rect x="40" y="90" width="130" height="60" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="105" y="115" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">BAT+</text>
<text x="105" y="135" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">(18650 cell)</text>
<line x1="170" y1="120" x2="260" y2="120" stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round"/>
