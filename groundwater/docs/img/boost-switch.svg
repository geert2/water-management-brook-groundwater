<text x="255" y="314" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">N-MOSFET</text>
<text x="190" y="346" font-size="12" text-anchor="start" font-weight="bold" fill="#222">G</text>
<text x="320" y="300" font-size="12" text-anchor="end" font-weight="bold" fill="#222">D</text>
