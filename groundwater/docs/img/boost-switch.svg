<text x="127.5" y="324" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">100 ohm</text>
<circle cx="162" cy="340" r="4.5" fill="#222"/>
<line x1="162" y1="340" x2="162" y2="345.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="162" y1="405.0" x2="162" y2="410" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="152" y="345.0" width="20" height="60" rx="2" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="144" y="373.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">100 k</text>
<line x1="162" y1="410" x2="162" y2="420" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="148" y1="420" x2="176" y2="420" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="153" y1="426" x2="171" y2="426" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="158" y1="432" x2="166" y2="432" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="24" y="466" font-size="12" text-anchor="start" font-weight="normal" fill="#555">The 100 ohm gate resistor sits in series with GPIO7; the 100 kohm to GND holds the gate low while the pin floats in deep sleep.</text>
</svg>
