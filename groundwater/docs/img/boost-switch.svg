<text x="375" y="124" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">P-MOSFET</text>
<text x="310" y="150" font-size="12" text-anchor="start" font-weight="bold" fill="#222">S</text>
<text x="310" y="194" font-size="12" text-anchor="start" font-weight="bold" fill="#222">G</text>
