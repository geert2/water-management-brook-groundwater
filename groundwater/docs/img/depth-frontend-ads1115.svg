<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" font-family="Arial, Helvetica, sans-serif">
<rect width="1100" height="650" fill="#ffffff"/>
<text x="24" y="34" font-size="20" text-anchor="start" font-weight="bold" fill="#222">Depth channel - external ADS1115 (optional, finer resolution)</text>
<text x="24" y="56" font-size="13" text-anchor="start" font-weight="normal" fill="#555">Differential reading A0-A1 across the shunt. Select depth-adc-ads1115.yaml in the node file.</text>
<rect x="40" y="80" width="170" height="60" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
<text x="125" y="105" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">MT3608 boost</text>
<text x="125" y="125" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">OUT+ = 18.0 V</text>
<line x1="210" y1="110" x2="330" y2="110" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<text x="270" y="102" font-size="12" text-anchor="middle" font-weight="normal" fill="#d32f2f">18 V</text>
<rect x="330" y="70" width="170" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="415" y="98" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">TL-136</text>
<text x="415" y="116" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">level transmitter</text>
<text x="415" y="134" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">2-wire, 4-20 mA</text>
<text x="322" y="128" font-size="11" text-anchor="end" font-weight="normal" fill="#222">V+ (red)</text>
<text x="415" y="172" font-size="11" text-anchor="middle" font-weight="normal" fill="#1565c0">Out (blue)</text>
<line x1="415" y1="180" x2="415" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="415" cy="250" r="4.5" fill="#1565c0"/>
<line x1="415" y1="250" x2="415" y2="315.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="415" y1="375.0" x2="415" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="405" y="315.0" width="20" height="60" rx="2" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="397" y="343.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">100 ohm</text>
<text x="397" y="358.0" font-size="12" text-anchor="end" font-weight="normal" fill="#222">0.1 % shunt</text>
<line x1="415" y1="250" x2="470" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<line x1="470" y1="250" x2="505.0" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<line x1="565.0" y1="250" x2="600" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<rect x="505.0" y="240" width="60" height="20" rx="2" fill="#fff" stroke="#1565c0" stroke-width="2"/>
<text x="535.0" y="234" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">1 kohm</text>
<line x1="600" y1="250" x2="720" y2="250" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="660" cy="250" r="4.5" fill="#1565c0"/>
<line x1="660" y1="250" x2="660" y2="290" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<rect x="626" y="290" width="68" height="50" rx="8" fill="#fff8e1" stroke="#e0a100" stroke-width="2"/>
<text x="660" y="311" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">BAT54S</text>
<text x="660" y="327" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">clamp</text>
<line x1="660" y1="340" x2="660" y2="370" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="660" y1="370" x2="660" y2="380" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="646" y1="380" x2="674" y2="380" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="651" y1="386" x2="669" y2="386" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="656" y1="392" x2="664" y2="392" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="660" y="404" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">to 3V3 + GND</text>
<line x1="415" y1="440" x2="415" y2="470" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="415" y1="470" x2="415" y2="480" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="401" y1="480" x2="429" y2="480" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="406" y1="486" x2="424" y2="486" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="411" y1="492" x2="419" y2="492" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="415" cy="440" r="4.5" fill="#222"/>
<line x1="415" y1="440" x2="470" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="470" y1="440" x2="505.0" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="565.0" y1="440" x2="600" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="505.0" y="430" width="60" height="20" rx="2" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="535.0" y="424" font-size="12" text-anchor="middle" font-weight="normal" fill="#222">1 kohm</text>
<line x1="600" y1="440" x2="720" y2="440" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="720" y="215" width="150" height="320" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="795" y="240" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">ADS1115</text>
<text x="795" y="258" font-size="11" text-anchor="middle" font-weight="normal" fill="#222">16-bit I2C ADC</text>
<text x="728" y="254" font-size="12" text-anchor="start" font-weight="bold" fill="#222">A0</text>
<text x="728" y="444" font-size="12" text-anchor="start" font-weight="bold" fill="#222">A1</text>
<line x1="870" y1="300" x2="895" y2="300" stroke="#d32f2f" stroke-width="2.5" stroke-linecap="round"/>
<text x="862" y="304" font-size="12" text-anchor="end" font-weight="bold" fill="#222">VDD</text>
<text x="901" y="304" font-size="12" text-anchor="start" font-weight="normal" fill="#d32f2f">3V3 (Vext)</text>
<line x1="870" y1="340" x2="895" y2="340" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="862" y="344" font-size="12" text-anchor="end" font-weight="bold" fill="#222">GND</text>
<text x="901" y="344" font-size="12" text-anchor="start" font-weight="normal" fill="#222">GND</text>
<line x1="870" y1="380" x2="895" y2="380" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="862" y="384" font-size="12" text-anchor="end" font-weight="bold" fill="#222">ADDR</text>
<text x="901" y="384" font-size="12" text-anchor="start" font-weight="normal" fill="#222">GND (addr 0x48)</text>
<line x1="870" y1="420" x2="895" y2="420" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
<text x="862" y="424" font-size="12" text-anchor="end" font-weight="bold" fill="#222">SDA</text>
<text x="901" y="424" font-size="12" text-anchor="start" font-weight="normal" fill="#2e7d32">GPIO41</text>
<line x1="870" y1="460" x2="895" y2="460" stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round"/>
<text x="862" y="464" font-size="12" text-anchor="end" font-weight="bold" fill="#222">SCL</text>
<text x="901" y="464" font-size="12" text-anchor="start" font-weight="normal" fill="#ef6c00">GPIO42</text>
<text x="24" y="575" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Resolution at 100 ohm: about 0.4 mm of water per step at +/-4.096 V (default), 0.2 mm at +/-2.048 V (ads_gain: "2.048").</text>
<text x="24" y="599" font-size="13" text-anchor="start" font-weight="normal" fill="#222">The ADS1115 is powered from Vext: it is probed during boot, so the firmware switches Vext on before the components are set up.</text>
<text x="24" y="623" font-size="13" text-anchor="start" font-weight="normal" fill="#222">ADS1115 inputs must never exceed VDD + 0.3 V: keep the 1 kohm resistors and the clamp. The TL-136 itself (about 0.3-0.5 % FS) limits accuracy.</text>
</svg>
