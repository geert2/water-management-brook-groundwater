# Everything the gateway needs for ONE well. Instantiated from water-well-gateway.yaml
# with these variables: well, well_label, node_name, depth_offset, box_id, token,
# depth_id, ec_id, temp_id, and the calibration values shunt_ohm, zero_offset_m, span_scale,
# ec_gain, ec_offset, depth_calibrated, ec_calibrated.
# remote_id / broadcast_id behaviour: ESPHome packet_transport [R2] (`internal: false` verified by `esphome config` [R9]).
# The remote_id values (vd, ve, t, v, bt, bp, bh, n) must match `broadcast_id` in common-well-node.yaml.
#
# The node sends RAW values (shunt volts, EC module volts). Calibration happens HERE, so a new
# calibration is a gateway re-flash over Wi-Fi, not a USB visit to the well. (Idea from the Meetbeek set.)

globals:
  - id: ${well}_last_rx_ms
    type: uint32_t
    initial_value: '0'
  - id: ${well}_seen
    type: bool
    initial_value: 'false'
  - id: ${well}_last_seq
    type: uint32_t
    initial_value: '0'
  - id: ${well}_lost_total
    type: int
    initial_value: '0'
  - id: ${well}_reset_total
    type: int
    initial_value: '0'

number:
  # Sensor depth below ground. Adjustable from Home Assistant, survives reboots.
  - platform: template
    id: ${well}_sensor_depth
    name: "${well_label} Sensor Depth Below Ground"
    unit_of_measurement: "m"
    device_class: distance
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${depth_offset}
    min_value: 0.5
    max_value: 30
    step: 0.01
    mode: box

sensor:
  # ---- RAW values from the node ------------------------------------------------
  - platform: packet_transport
    provider: ${node_name}
    id: ${well}_v_depth
    remote_id: vd
    internal: false
    name: "${well_label} Depth Shunt Voltage"
    unit_of_measurement: "V"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 4

  - platform: packet_transport
    provider: ${node_name}
    id: ${well}_v_ec
    remote_id: ve
    internal: false
    name: "${well_label} EC Raw Voltage"
    unit_of_measurement: "V"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 4

  - platform: packet_transport
    provider: ${node_name}
    id: ${well}_temp_c
    remote_id: t
    internal: false
    name: "${well_label} Groundwater Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2

  # Packet counter. It is the LAST value of each packet, so it starts the calculation and the upload.
  - platform: packet_transport
    provider: ${node_name}
    id: ${well}_seq
    remote_id: "n"
    internal: false
    name: "${well_label} Packet Counter"
    entity_category: diagnostic
    accuracy_decimals: 0
    on_value:
      then:
        - delay: 1s        # let the other values of the same packet arrive first
        - lambda: |-
            id(${well}_last_rx_ms) = millis();
            id(${well}_seen) = true;
            uint32_t seq = (uint32_t) x;
            if (id(${well}_last_seq) != 0) {
              if (seq > id(${well}_last_seq)) id(${well}_lost_total) += (int) (seq - id(${well}_last_seq) - 1);
              else if (seq < id(${well}_last_seq)) id(${well}_reset_total) += 1;   // counter went back: node lost power
            }
            id(${well}_last_seq) = seq;
            id(${well}_lost).publish_state(id(${well}_lost_total));
            id(${well}_resets).publish_state(id(${well}_reset_total));
        - component.update: ${well}_loop_ma
        - component.update: ${well}_water_column_m
        - component.update: ${well}_ec_us
        - component.update: ${well}_depth_bgl
        - component.update: ${well}_qc_flags
        - script.execute:
            id: upload_to_opensensemap
            box_id: "${box_id}"
            token: "${token}"
            depth_sensor_id: "${depth_id}"
            ec_sensor_id: "${ec_id}"
            temp_sensor_id: "${temp_id}"
            # When the water is below the probe the depth is unknown, so it is not uploaded.
            depth_val: !lambda |-
              float col = id(${well}_water_column_m).state;
              return (isnan(col) || col < 0.03f) ? NAN : id(${well}_depth_bgl).state;
            ec_val: !lambda 'return id(${well}_ec_us).state;'
            temp_val: !lambda 'return id(${well}_temp_c).state;'

  # ---- CALCULATED here (calibration constants come from water-well-gateway.yaml) ----
  # TL-136 loop current from the shunt voltage.
  - platform: template
    id: ${well}_loop_ma
    name: "${well_label} Level Loop Current"
    unit_of_measurement: "mA"
    device_class: current
    entity_category: diagnostic
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      float v = id(${well}_v_depth).state;
      if (isnan(v)) return NAN;
      return v / ${shunt_ohm} * 1000.0f;

  # Water column above the sensor: TL-136 0-${tl136_range_m} m, 4-20 mA.
  - platform: template
    id: ${well}_water_column_m
    name: "${well_label} Water Column Height"
    unit_of_measurement: "m"
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      float ma = id(${well}_loop_ma).state;
      // Outside 3.5-22 mA means a broken wire, a short or a boost fault.
      if (isnan(ma) || ma < 3.5f || ma > 22.0f) return NAN;
      float depth = (ma - 4.0f) / 16.0f * ${tl136_range_m};
      depth = depth * ${span_scale} + ${zero_offset_m};
      return depth < -0.1f ? NAN : depth;

  # Electrical conductivity at 25 C: DFRobot cubic TDS curve [R19] + temperature compensation + your calibration.
  - platform: template
    id: ${well}_ec_us
    name: "${well_label} Electrical Conductivity"
    unit_of_measurement: "µS/cm"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float v = id(${well}_v_ec).state;
      if (isnan(v)) return NAN;
      float temp = id(${well}_temp_c).state;
      if (isnan(temp)) temp = 12.0f;   // fallback if the DS18B20 failed
      float comp_v = v / (1.0f + 0.02f * (temp - 25.0f));
      // TDS = EC / 2, so the 0.5 and 2.0 factors cancel.
      float ec = 133.42f * comp_v * comp_v * comp_v - 255.86f * comp_v * comp_v + 857.39f * comp_v;
      ec = ec * ${ec_gain} + ${ec_offset};
      // Outside the probe's rated range the value is not published or uploaded.
      return (ec < 0.0f || ec > ${ec_max_us}) ? NAN : ec;

  - platform: template
    id: ${well}_depth_bgl
    name: "${well_label} Water Table Depth Below Ground"
    unit_of_measurement: "m"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    lambda: |-
      float col = id(${well}_water_column_m).state;
      if (isnan(col)) return NAN;
      if (col < 0.0f) col = 0.0f;
      return id(${well}_sensor_depth).state - col;

  # ---- Data quality ------------------------------------------------------------
  # Sum of bits: 1 = level loop out of range, 2 = EC invalid or out of range, 4 = water temperature invalid,
  # 8 = battery below low_battery_v (or not read), 16 = EC not calibrated, 32 = depth not calibrated.
  - platform: template
    id: ${well}_qc_flags
    name: "${well_label} QC Flags"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      int flags = 0;
      float ma = id(${well}_loop_ma).state;
      if (isnan(ma) || ma < 3.5f || ma > 22.0f) flags |= 1;
      if (isnan(id(${well}_ec_us).state)) flags |= 2;
      float t = id(${well}_temp_c).state;
      if (isnan(t) || t < -2.0f || t > 35.0f) flags |= 4;
      float vb = id(${well}_battery_v).state;
      if (isnan(vb) || vb < ${low_battery_v}) flags |= 8;
      if (${ec_calibrated} == 0) flags |= 16;
      if (${depth_calibrated} == 0) flags |= 32;
      return flags;

  # Readings that never arrived (gaps in the packet counter) and node power losses (counter restarted).
  - platform: template
    id: ${well}_lost
    name: "${well_label} Readings Lost"
    state_class: total_increasing
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: ${well}_resets
    name: "${well_label} Node Resets"
    state_class: total_increasing
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

  # BME280 in the node enclosure
  - platform: packet_transport
    provider: ${node_name}
    id: ${well}_enclosure_temp
    remote_id: bt
    internal: false
    name: "${well_label} Enclosure Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1

  - platform: packet_transport
    provider: ${node_name}
    id: ${well}_air_pressure
    remote_id: bp
    internal: false
    name: "${well_label} Air Pressure"
    unit_of_measurement: "hPa"
    device_class: atmospheric_pressure
    state_class: measurement
    accuracy_decimals: 1

  - platform: packet_transport
    provider: ${node_name}
    id: ${well}_enclosure_humidity
    remote_id: bh
    internal: false
    name: "${well_label} Enclosure Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: packet_transport
    provider: ${node_name}
    id: ${well}_battery_v
    remote_id: v
    internal: false
    name: "${well_label} Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 2

binary_sensor:
  # True when the water level is at or below the probe (dry season / pumped down)
  - platform: template
    name: "${well_label} Water Below Sensor"
    icon: mdi:water-off
    lambda: |-
      float col = id(${well}_water_column_m).state;
      if (isnan(col)) return {};
      return col < 0.03f;

  - platform: template
    name: "${well_label} Node Online"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      if (!id(${well}_seen)) return false;
      return (uint32_t) (millis() - id(${well}_last_rx_ms)) < ${offline_after_ms};
