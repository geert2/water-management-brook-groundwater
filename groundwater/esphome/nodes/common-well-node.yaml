# Shared firmware for a battery-powered groundwater field node (Heltec WiFi LoRa 32 V3).
# Deep sleep: no network or OTA while asleep [R7]; DS18B20 conversion time is not in the ESPHome page [R8][R23].
# Per-node values are overridden in water-well-node-N.yaml via `substitutions:`.
#
# Sources for the settings below are listed in shared/docs/REFERENCES.md ([R#] tags in comments):
#   sx126x / packet_transport / adc / deep_sleep / bme280 ...  -> ESPHome component docs [R1]-[R9]
#   Heltec V3 pins, battery divider, Vext, TCXO               -> [R10]-[R14]
#
# The board, LoRa radio, Vext/battery/LED outputs, I2C and 1-Wire buses, battery sensor,
# deep sleep and the EC input are shared with brook/lite: see shared/esphome/.

packages:
  node_base: !include ../../../shared/esphome/heltec-v3/node-base.yaml
  ec_adc: !include ../../../shared/esphome/sensors/ec-sen0244-adc.yaml

substitutions:
  # --- timing ---
  sleep_minutes: "60"            # time between readings (a 0-30 s random jitter is added)
  low_battery_v: "3.4"           # below this, skip measuring and sleep longer (ignored if the reading is < 2 V, see script)
  low_battery_sleep_minutes: "360"
  warmup: 1000ms                 # settling time after the boost converter (GPIO7) is switched on, after the battery reading.
                                 # The TL-136 loop needs to settle; verify on the bench (the Meetbeek set waits 3 s).
  ds18b20_wait: 900ms            # DS18B20 12-bit conversion takes up to 750 ms [R23]
  tx_wait: 1500ms                # airtime + margin before the radio sleeps. Semtech AN1200.13 formula [R22]:
                                 # 30-110 byte frames take about 0.23-0.6 s at SF9 / 125 kHz / CR 4/5
  # Calibration (shunt value, zero offset, span, EC gain/offset) is NOT done here any more.
  # The node sends RAW voltages; the gateway converts them (esphome/gateway/water-well-gateway.yaml),
  # so recalibrating never needs a USB visit to the well. Idea taken from the Meetbeek set.
  # Battery divider and board revision (vbat_scale, vbat_ctrl_active_low, vext_active_low):
  # defaults in shared/esphome/heltec-v3/node-base.yaml, override them in the node file.
  # --- LoRa: 868.1 MHz (868.0-868.6 MHz sub-band, 1 % duty cycle) [R25] ---
  lora_frequency: "868100000"
  # --- BME280 ---
  bme280_address: "0x76"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    # I2C / 1-Wire devices (BME280, ADS1115, DS18B20) are powered from Vext and are
    # probed once during setup, so the rail must be ON before they are set up.
    # Priority 750 = after the GPIO output exists (800) and before sensors (600).
    - priority: 750
      then:
        - output.turn_on: vext_power
        - lambda: 'delay(30);'   # let the devices power up before they are probed
    # Normal measurement cycle once everything is set up.
    - priority: -100
      then:
        - script.execute: measure_and_sleep

# The node only transmits, once per cycle, when the script calls component.update.
packet_transport:
  - platform: sx126x
    id: lora_transport
    update_interval: never
    encryption: !secret lora_encryption_key
    sensors:
      # Short broadcast IDs keep the frame small (shorter airtime, less energy).
      # The gateway maps these with `remote_id:`.
      # RAW values: the gateway applies calibration and temperature compensation.
      - id: depth_voltage            # volts across the shunt (shared/esphome/sensors/tl136-adc-*.yaml)
        broadcast_id: vd
      - id: ec_voltage               # raw EC module output, volts
        broadcast_id: ve
      - id: groundwater_temp_c
        broadcast_id: t
      - id: battery_voltage_v
        broadcast_id: v
      # BME280 inside the enclosure: air temperature, pressure, humidity
      - id: enclosure_temp_c
        broadcast_id: bt
      - id: air_pressure_hpa
        broadcast_id: bp
      - id: enclosure_humidity
        broadcast_id: bh
      # Sequence number, LAST in the packet: the gateway counts lost readings and node resets
      # and starts its calculations when it arrives.
      - id: tx_seq
        broadcast_id: "n"

output:
  # Boost converter (MT3608) power switch: GPIO7 HIGH -> N-MOSFET on -> P-MOSFET on -> BAT+ reaches
  # the MT3608 input. A 100 k pull-down keeps it OFF during deep sleep. See docs/wiring.md section 2.
  - platform: gpio
    pin: GPIO7
    id: boost_power

sensor:
  # 0. BME280 in the enclosure (optional; shows 'unavailable' if not fitted).
  #    Address 0x76 (SDO to GND) or 0x77 (SDO to VCC) [R5][R24].
  - platform: bme280_i2c
    id: bme280_hub
    address: ${bme280_address}
    update_interval: never
    temperature:
      id: enclosure_temp_c
      name: "Enclosure Temperature"
      oversampling: 1x
    pressure:
      id: air_pressure_hpa
      name: "Air Pressure"
      oversampling: 1x
    humidity:
      id: enclosure_humidity
      name: "Enclosure Humidity"
      oversampling: 1x

  # 1. Groundwater temperature (DS18B20). Result arrives ~750 ms after update.
  - platform: dallas_temp
    id: groundwater_temp_c
    name: "Groundwater Temperature"
    accuracy_decimals: 2
    update_interval: never

  # 2. Depth channel: the raw shunt voltage `depth_voltage` comes from shared/esphome/sensors/tl136-adc-esp.yaml
  #    or tl136-adc-ads1115.yaml (chosen in the node file) and is sent as it is.

  # 3. Electrical conductivity: raw voltage `ec_voltage` of the DFRobot SEN0244 module on GPIO6 comes from
  #    shared/esphome/sensors/ec-sen0244-adc.yaml; the gateway applies the TDS curve, 25 C compensation
  #    and your two-point calibration.

  # 3b. Sequence number. RTC memory survives deep sleep but not a power loss, so a counter that
  #     restarts at 1 tells the gateway the node lost power. Local static, no flash wear.
  - platform: template
    id: tx_seq
    update_interval: never
    internal: true
    lambda: |-
      static RTC_DATA_ATTR uint32_t seq = 0;
      seq++;
      return (float) seq;

  # 4. Node battery voltage `battery_voltage_v`: shared/esphome/heltec-v3/node-base.yaml.
  #    Read at rest in the script below, before the boost converter loads the cell.

script:
  - id: measure_and_sleep
    mode: single
    then:
      # Wake-up flash + battery reading with the divider enabled
      - output.turn_on: status_led
      - output.turn_on: vbat_adc_enable
      - delay: 50ms
      - component.update: battery_voltage_v
      - output.turn_off: vbat_adc_enable
      - output.turn_off: status_led

      # Low battery: report the voltage only, then sleep much longer
      - if:
          condition:
            # A reading below 2 V (or NaN) means the divider is not connected (wrong
            # vbat_ctrl_active_low?), not an empty cell: do not lock the node into low-battery mode.
            lambda: |-
              float v = id(battery_voltage_v).state;
              return !isnan(v) && v > 2.0f && v < ${low_battery_v};
          then:
            - output.turn_off: boost_power
            - output.turn_off: vext_power     # Vext has been on since boot
            - component.update: tx_seq
            - component.update: lora_transport
            - delay: ${tx_wait}
            - sx126x.set_mode_sleep:
            - deep_sleep.enter:
                id: deep_sleep_control
                sleep_duration: !lambda 'return (uint32_t) ${low_battery_sleep_minutes} * 60000UL;'

      # Normal cycle
      - output.turn_on: vext_power         # already on; harmless
      - output.turn_on: boost_power        # MT3608 on only now, so the battery was read without the 18 V loop load
      - delay: ${warmup}
      - component.update: bme280_hub
      - component.update: groundwater_temp_c
      - component.update: depth_voltage    # starts the (ADS1115) conversion
      - component.update: ec_voltage
      - delay: ${ds18b20_wait}             # DS18B20 / BME280 / ADS1115 results arrive meanwhile
      - output.turn_off: boost_power
      - output.turn_off: vext_power
      - component.update: tx_seq
      - component.update: lora_transport    # broadcast the raw values + sequence number
      - delay: ${tx_wait}
      - sx126x.set_mode_sleep:
      - deep_sleep.enter:
          id: deep_sleep_control
          # random 0-30 s jitter keeps several nodes from colliding over time
          sleep_duration: !lambda 'return (uint32_t) ${sleep_minutes} * 60000UL + (random_uint32() % 30000UL);'
